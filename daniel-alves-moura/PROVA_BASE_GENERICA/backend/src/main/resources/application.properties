spring.application.name=prova-base
server.port=8080

# MySQL / XAMPP. Altere por variáveis de ambiente se necessário.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:5244/prova_base?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: em produção, coloque em variável de ambiente.
app.jwt.secret=${JWT_SECRET:chave-super-secreta-para-prova-com-mais-de-32-bytes-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Mostra mensagens de validação na resposta (útil em desenvolvimento/prova).
server.error.include-message=always
